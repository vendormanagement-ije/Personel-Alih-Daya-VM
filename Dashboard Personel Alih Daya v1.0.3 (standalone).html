  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ca979ee6-e724-41a7-8d2f-fb401dae669e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n\n<link rel=\"preconnect\" href=\"https://docs.google.com\">\n<link rel=\"preconnect\" href=\"https://docs.google.com\" crossorigin=\"\">\n<style>\n@keyframes spin { to { transform: rotate(360deg); } }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n* { box-sizing: border-box; }\nbutton, input { font-family: inherit; }\nbody { margin: 0; background: #eef1f6; -webkit-font-smoothing: antialiased; font-family: Helvetica, Arial, sans-serif; }\na { color: #1e3a70; text-decoration: none; }\na:hover { color: #16305f; }\n::-webkit-scrollbar { height: 9px; width: 9px; }\n::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }\n.pbar-fill { position: relative; }\n.res-row:hover { background: #f5f8ff !important; border-color: #1e3a70 !important; }\n.mini:hover { filter: brightness(.97); }\n.sta-card-head > div, .sta-name > span, .sta-name > div, .sta-badges > div { white-space: nowrap; }\n.hc-breakdown-grid > div > div { white-space: nowrap; }\n.badge-legend > div > span:first-child { white-space: nowrap; }\n.badge-legend > div > span:last-child { white-space: normal; }\n@media (max-width: 760px) {\n  .m-page { box-shadow: none !important; }\n  .m-head { padding: 13px 14px !important; gap: 10px !important; }\n  .m-title { font-size: 18px !important; }\n  .m-body { padding: 12px !important; gap: 13px !important; }\n  .m-kpi { grid-template-columns: 1fr !important; gap: 10px !important; }\n  .m-kpi > div { padding: 15px 16px !important; }\n  .m-kpi-num { font-size: 26px !important; }\n  .m-stats { grid-template-columns: repeat(2,1fr) !important; }\n  .m-stalist { max-height: none !important; padding: 10px !important; gap: 10px !important; }\n  .m-info { grid-template-columns: 1fr !important; }\n  .m-search { padding: 28px 12px 44px !important; }\n  .m-search-title { font-size: 23px !important; }\n  .res-row { padding: 10px 11px !important; }\n}\n@media (max-width: 420px) {\n  .m-title { font-size: 16.5px !important; }\n}\n.kpi-clickable:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(15,23,42,.12) !important; border-color: #cbd5e1 !important; }\n.stat-clickable { cursor: pointer; position: relative; }\n.stat-clickable:hover { border-color: #1e3a70 !important; box-shadow: 0 6px 16px rgba(15,23,42,.1); }\n.chev-orange { color: #ff7a1a !important; font-weight: 900 !important; display: inline-block; font-size: 15px !important; letter-spacing: 1px; animation: chevBounce 1.1s ease-in-out infinite, chevGlow 1.1s ease-in-out infinite; }\n@keyframes chevBounce { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(3px) scaleX(1.25); } }\n@keyframes chevGlow { 0%, 100% { text-shadow: 0 0 2px rgba(255,122,26,.3); filter: brightness(1); } 50% { text-shadow: 0 0 10px rgba(255,122,26,.9), 0 0 18px rgba(255,154,60,.6); filter: brightness(1.3); } }\n.chev-orange-svg { animation: chevPulse 1.3s ease-in-out infinite; }\n@keyframes chevPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }\n@media (max-width: 680px) {\n  .guide-book-label { display: none; }\n  .app-header { position: static !important; background: none !important; box-shadow: none !important; padding: 12px 12px 0 !important; }\n  .app-header-card { background: linear-gradient(135deg,#0f2a5c 0%,#1e50a8 52%,#4f93f0 100%) !important; border-radius: 18px !important; padding: 15px 16px 16px !important; box-shadow: 0 8px 22px rgba(15,42,92,.30) !important; flex-direction: column !important; align-items: stretch !important; gap: 13px !important; }\n  .hdr-source { display: none !important; }\n  .hdr-right { width: 100% !important; }\n  .hdr-refresh { flex: 0 0 auto !important; }\n  .hdr-status { flex: 1 1 auto !important; }\n  .search-card { c>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { loading: true, refreshing: false, error: '', rows: null, hcReady: false, hcError: '', hcDataUpdated: '',\n    lastUpdated: '—', q: '', sel: null,\n    mStaSearch: '', mStaCatFilter: '', mStaMosFilter: '', staKpiOpen: {}, poOpen: {}, staCardOpen: {}, issueOpen: {},\n    mitraReportCopied: '', pdfDownloadingSta: null, pdfPctSta: 0, poDetailMitra: null,\n    pdfDownloadingMitra: false, pdfPctMitra: 0,\n    spReady: false, spUpdated: '', spError: '', mitraNotFound: false };\n\n  CSV_URL = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vSttEIl8mrenKwUD7B7zwIEXKV0Mt5ZfWE-6GmRvkOO3DV7oFa95EoDbquVFJ_WOFcdt70QRE-O8I6N/pub?gid=1647278393&single=true&output=csv\";\n  HC_CSV_URL = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vSHC9CSQSHZqkLN4N7gT9MMy8ce7K4GoXHNA_8_gBzJUYgkhAoFjKECZSKpjgfQg_A0mHv8uVwTni_v/pub?output=csv\";\n  SP_CSV_URL = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vTyK-DzYWmRFg3ocJRkHj8cwTNCSibdNl61tjVYdepjxK7mwVkjAijhFDaacbVM1jIFmrvBTnl3dyOs/pub?output=csv\";\n\n  _staCardEls = {};\n  _mitraDialogEl = null;\n  setMitraDialogEl = (el) => { this._mitraDialogEl = el; };\n  componentDidMount() { this.load(); this.loadHc(); this.loadSp(); }\n  loadDocLinks() {}\n  spParseSignal(raw) {\n    const t = (raw || '').trim();\n    if (!t || t === '-') return { cat: 'none', days: 0, label: '—' };\n    const n = parseInt((t.match(/(\\d+)/) || [])[1] || '0', 10);\n    const clean = t.replace(/[^\\x20-\\x7E]/g, '').replace(/\\s+/g, ' ').trim();\n    if (/OVERDUE/i.test(t)) return { cat: 'overdue', days: /HK/i.test(t) ? n * 2 : n, label: clean || 'OVERDUE' };\n    if (/Mendekat/i.test(t)) return { cat: 'warn', days: n, label: clean || 'Mendekat batas' };\n    if (/Aman/i.test(t)) return { cat: 'safe', days: n, label: clean || 'Aman' };\n    return { cat: 'none', days: 0, label: clean || '—' };\n  }\n\n  async loadSp() {\n    try {\n      const r = await fetch(this.SP_CSV_URL + '&_cb=' + Date.now(), { cache: 'no-store', priority: 'low' });\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      let lm = null; try { lm = r.headers.get('last-modified'); } catch (e) {}\n      const all = this.parseCSV(await r.text());\n      const header = (all[0] || []).map(h => (h || '').trim());\n      const ix = (name) => header.findIndex(h => h.toUpperCase() === name.toUpperCase());\n      const nz = (s) => (s || '').toUpperCase().replace(/\\s+/g, ' ').trim();\n      const iz = (name) => header.findIndex(h => nz(h) === nz(name));\n      const cPo = ix('PO'), cSta = ix('STASIUN'), cLama = ix('MITRA LAMA'), cPt = ix('NAMA PERUSAHAAN'),\n            cGanti = ix('MITRA PENGGANTI'), cReg = ix('REGION'), cPic = ix('PIC'), cSp = ix('STATUS SP'),\n            cTgl = ix('Tanggal Status SP'), cSig = ix('Overdue Signal'), cStat = ix('STATUS MITRA');\n      const fz = (...ws) => header.findIndex(h => ws.every(w => nz(h).includes(nz(w))));\n      const first = (...c) => { for (let i = 0; i < c.length; i++) if (c[i] >= 0) return c[i]; return -1; };\n      const cNoBap = iz('NO BAP PO CANCEL'), cKBap = iz('BAP PO Cancel'), cLMat = iz('BA Serah Terima Material'),\n            cMIkr = iz('BA Perpindahan Akun IKR'),\n            cLnkBatal = first(iz('LINK ATTACHMEN BA PEMBATALAN PO'), fz('ATTACH', 'PEMBATALAN'), 15),\n            cLnkSpk = first(iz('LINK ATTACHMENT SPK'), fz('ATTACH', 'SPK'), 16), cTglSpk = iz('TANGGAL RILIS SPK'),\n            cLnkBap = first(iz('LINK ATTACHMENT BAP PO CANCEL'), fz('ATTACH', 'BAP'), 18),\n            cLnkMat = first(iz('LINK ATTACHMENT BA SERAH TERIMA MATERIAL'), fz('ATTACH', 'MATERIAL'), 19),\n            cLnkIkr = first(iz('LINK ATTACHMENT PERPINDAHAN IKR'), fz('ATTACH', 'IKR'), 20), cMigrasi = iz('STATUS MIGRASI IKR'),\n            cPtGanti = iz('PT Mitra Pengganti'), cRemark = iz('Remark');\n      // Kolom pembayaran/penerimaan (AF..AJ)\n      const cTrDp = first(fz('DP', 'DITERIMA'), 31),\n            cTrBast = first(fz('BAST', 'TERIMA'), 32),\n            cTrRetensi = first(fz('RETENSI'), 33),\n            cTrHc = first(fz('NOMINAL', 'HC'), 34),\n            cTrDonasi = first(fz('NOMINAL', 'DONASI'), 35);\n      const g = (row, i) => (i >= 0 ? (row[i] || '') : '').trim();\n      const rows = all.slice(1).filter(row => row.some(c => c && c.trim())).map(row => {\n        const s = this.spParseSignal(g(row, cSig));\n        const sp = g(row, cSp).toUpperCase();\n        const lvl = /SP\\s*3/.test(sp) ? 3 : /SP\\s*2/.test(sp) ? 2 : /SP\\s*1/.test(sp) ? 1 : 0;\n        const catW = s.cat === 'overdue' ? 4000 : s.cat === 'warn' ? 3000 : s.cat === 'safe' ? 2000 : 0;\n        return {\n          po: g(row, cPo), stasiun: g(row, cSta), mitra: g(row, cLama) || g(row, cPt),\n          pengganti: g(row, cGanti), region: g(row, cReg), pic: g(row, cPic),\n          sp: sp || '', lvl, tgl: g(row, cTgl), statusMitra: g(row, cStat),\n          sigCat: s.cat, sigDays: s.days, sigLabel: s.label,\n          score: lvl * 10000 + catW + s.days * 20,\n          lamaRaw: g(row, cLama), ptLama: g(row, cPt), ptGanti: g(row, cPtGanti), noBap: g(row, cNoBap), remark: g(row, cRemark),\n          kBap: g(row, cKBap), lMat: g(row, cLMat), mIkr: g(row, cMIkr), migrasi: g(row, cMigrasi),\n          tglSpk: g(row, cTglSpk),\n          terima: [\n            { label: 'DP diterima', col: 'AF', raw: g(row, cTrDp) },\n            { label: 'BAST diterima', col: 'AG', raw: g(row, cTrBast) },\n            { label: 'Nominal retensi', col: 'AH', raw: g(row, cTrRetensi) },\n            { label: 'Nominal HC', col: 'AI', raw: g(row, cTrHc) },\n            { label: 'Nominal donasi', col: 'AJ', raw: g(row, cTrDonasi) }\n          ],\n          docs: [\n            { key: 'batal', label: 'BA Pembatalan PO', col: 'P', raw: g(row, cLnkBatal) },\n            { key: 'spk', label: 'SPK', col: 'Q', raw: g(row, cLnkSpk) },\n            { key: 'bap', label: 'BAP PO Cancel', col: 'S', raw: g(row, cLnkBap) },\n            { key: 'mat', label: 'BA Serah Terima Material', col: 'T', raw: g(row, cLnkMat) },\n            { key: 'ikr', label: 'BA Perpindahan IKR', col: 'U', raw: g(row, cLnkIkr) }\n          ]\n        };\n      });\n      this.spRows = rows;\n      this._spIndex = null;\n      const updated = lm ? new Date(lm).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';\n      this.setState({ spReady: true, spUpdated: updated });\n      this.loadDocLinks();\n    } catch (e) { this.setState({ spError: e.message || String(e) }); }\n  }\n\n  spBadgeFor(mitra, stasiun) {\n    const rows = this.spRows || [];\n    if (!rows.length) return { spHasBadge: false };\n    if (!this._spIndex) {\n      const idx = {};\n      rows.forEach(r => {\n        if (!r.lvl) return;\n        const mk = this.normName(r.mitra || '');\n        if (!mk) return;\n        (idx[mk] = idx[mk] || []).push({ sta: this.normStasiunLabel(r.stasiun || ''), lvl: r.lvl, tgl: r.tgl, sig: r.sigLabel, po: r.po });\n      });\n      this._spIndex = idx;\n    }\n    const mk = this.normName(mitra || '');\n    let bucket = this._spIndex[mk];\n    if (!bucket) {\n      const k = Object.keys(this._spIndex).find(x => x && mk && (x.includes(mk) || mk.includes(x)));\n      bucket = k ? this._spIndex[k] : null;\n    }\n    if (!bucket) return { spHasBadge: false };\n    const sk = this.normStasiunLabel(stasiun || '');\n    const hits = bucket.filter(b => b.sta && sk && (b.sta === sk || b.sta.includes(sk) || sk.includes(b.sta)));\n    if (!hits.length) return { spHasBadge: false };\n    const top = hits.reduce((a, b) => (b.lvl > a.lvl ? b : a));\n    return {\n      spHasBadge: true, spBadgeLabel: 'SP ' + top.lvl,\n      spBadgeColor: '#fff', spBadgeBg: '#dc2626', spBadgeBorder: '#dc2626',\n      spBadgeTitle: 'Surat Peringatan ' + top.lvl + ' · ' + (top.po || '—') + ' · Tgl SP ' + (top.tgl || '—') + ' · ' + (top.sig || '—')\n    };\n  }\n\n  downloadCardPdf(el, filename, progressKey) {\n    if (!el || !window.html2canvas || !window.jspdf) return;\n    if (this.state.pdfDownloadingSta === progressKey) return;\n    this.setState({ pdfDownloadingSta: progressKey, pdfPctSta: 0 });\n    let raf = null;\n    const tick = () => {\n      this.setState((s) => {\n        const cur = (s.pdfDownloadingSta === progressKey) ? (s.pdfPctSta || 0) : 0;\n        if (cur >= 90) return null;\n        return { pdfPctSta: cur + (90 - cur) * 0.08 + 0.6 };\n      });\n      raf = requestAnimationFrame(tick);\n    };\n    raf = requestAnimationFrame(tick);\n    const finish = () => {\n      if (raf) cancelAnimationFrame(raf);\n      this.setState({ pdfPctSta: 100 });\n      setTimeout(() => this.setState({ pdfDownloadingSta: null, pdfPctSta: 0 }), 500);\n    };\n    const hiddenEls = Array.from(el.querySelectorAll('.pdf-export-hide'));\n    const prevDisplay = hiddenEls.map(n => n.style.display);\n    hiddenEls.forEach(n => { n.style.display = 'none'; });\n    window.html2canvas(el, { backgroundColor: '#f8fafc', scale: 2, logging: false, useCORS: true }).then((canvas) => {\n      hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; });\n      const { jsPDF } = window.jspdf;\n      const imgW = canvas.width, imgH = canvas.height;\n      const footerH = 150;\n      const pdf = new jsPDF({ orientation: imgW > imgH ? 'landscape' : 'portrait', unit: 'px', format: [imgW, imgH + footerH] });\n      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgW, imgH);\n      pdf.setFillColor(248, 250, 252);\n      pdf.rect(0, imgH, imgW, footerH, 'F');\n      pdf.setTextColor(100, 116, 139);\n      pdf.setFont(undefined, 'bold');\n      pdf.setFontSize(32);\n      const ts = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n      pdf.text('PDF auto generated by Vendor Management', imgW / 2, imgH + footerH / 2 - 8, { align: 'center' });\n      pdf.setFontSize(26);\n      pdf.setFont(undefined, 'normal');\n      pdf.text(ts, imgW / 2, imgH + footerH / 2 + 34, { align: 'center' });\n      pdf.save(filename + '-VendorManagement.pdf');\n      finish();\n    }).catch(() => { hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; }); finish(); });\n  }\n  downloadCardImage(el, filename) {\n    if (!el || !window.html2canvas || !window.jspdf) return;\n    const hiddenEls = Array.from(el.querySelectorAll('.pdf-export-hide'));\n    const prevDisplay = hiddenEls.map(n => n.style.display);\n    hiddenEls.forEach(n => { n.style.display = 'none'; });\n    window.html2canvas(el, { backgroundColor: '#ffffff', scale: 2, logging: false }).then((canvas) => {\n      hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; });\n      const { jsPDF } = window.jspdf;\n      const imgW = canvas.width, imgH = canvas.height;\n      const footerH = 150;\n      const pdf = new jsPDF({ orientation: imgW > imgH ? 'landscape' : 'portrait', unit: 'px', format: [imgW, imgH + footerH] });\n      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgW, imgH);\n      pdf.setFillColor(255, 255, 255);\n      pdf.rect(0, imgH, imgW, footerH, 'F');\n      pdf.setTextColor(100, 116, 139);\n      pdf.setFont(undefined, 'bold');\n      pdf.setFontSize(32);\n      const ts = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n      pdf.text('PDF auto generated by Vendor Management', imgW / 2, imgH + footerH / 2 - 8, { align: 'center' });\n      pdf.setFontSize(26);\n      pdf.setFont(undefined, 'normal');\n      pdf.text(ts, imgW / 2, imgH + footerH / 2 + 34, { align: 'center' });\n      pdf.save(filename + '-VendorManagement.pdf');\n    }).catch(() => { hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; }); });\n  }\n  downloadFullPagePdf(el, filename, pctKey, flagKey) {\n    if (!el || !window.html2canvas || !window.jspdf) return;\n    if (this.state[flagKey]) return;\n    this.setState({ [flagKey]: true, [pctKey]: 0 });\n    let raf = null;\n    const tick = () => {\n      this.setState((s) => {\n        const cur = s[pctKey] || 0;\n        if (cur >= 90) return null;\n        return { [pctKey]: cur + (90 - cur) * 0.08 + 0.6 };\n      });\n      raf = requestAnimationFrame(tick);\n    };\n    raf = requestAnimationFrame(tick);\n    const finish = () => {\n      if (raf) cancelAnimationFrame(raf);\n      this.setState({ [pctKey]: 100 });\n      setTimeout(() => this.setState({ [flagKey]: false, [pctKey]: 0 }), 500);\n    };\n    const hiddenEls = Array.from(el.querySelectorAll('.pdf-export-hide'));\n    const prevDisplay = hiddenEls.map(n => n.style.display);\n    hiddenEls.forEach(n => { n.style.display = 'none'; });\n    window.html2canvas(el, {\n      backgroundColor: '#f8fafc', scale: 2, logging: false, useCORS: true,\n      windowWidth: el.scrollWidth, windowHeight: el.scrollHeight, height: el.scrollHeight, width: el.scrollWidth,\n      onclone: (doc, clonedEl) => { clonedEl.style.maxHeight = 'none'; clonedEl.style.height = 'auto'; clonedEl.style.overflow = 'visible'; clonedEl.querySelectorAll('.pdf-export-hide').forEach(n => { n.style.display = 'none'; }); }\n    }).then((canvas) => {\n      hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; });\n      const { jsPDF } = window.jspdf;\n      const imgW = canvas.width, imgH = canvas.height;\n      const footerH = 150;\n      const pdf = new jsPDF({ orientation: imgW > imgH ? 'landscape' : 'portrait', unit: 'px', format: [imgW, imgH + footerH] });\n      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgW, imgH);\n      pdf.setFillColor(248, 250, 252);\n      pdf.rect(0, imgH, imgW, footerH, 'F');\n      pdf.setTextColor(100, 116, 139);\n      pdf.setFont(undefined, 'bold');\n      pdf.setFontSize(32);\n      const ts = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n      pdf.text('PDF auto generated by Vendor Management', imgW / 2, imgH + footerH / 2 - 8, { align: 'center' });\n      pdf.setFontSize(26);\n      pdf.setFont(undefined, 'normal');\n      pdf.text(ts, imgW / 2, imgH + footerH / 2 + 34, { align: 'center' });\n      pdf.save(filename + '-VendorManagement.pdf');\n      finish();\n    }).catch(() => { hiddenEls.forEach((n, i) => { n.style.display = prevDisplay[i]; }); finish(); });\n  }\n\n  spRows = [];\n  FIXED_MITRA = 'PERSONEL ALIH DAYA';\n\n  async load(attempt = 0, soft = false) {\n    const MAX_RETRY = 4;\n    if (attempt === 0) this.setState(soft ? { refreshing: true } : { loading: true, error: '' });\n    try {\n      const r = await fetch(this.CSV_URL + '&_cb=' + Date.now(), { cache: 'no-store', priority: 'high' });\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      const all = this.parseCSV(await r.text());\n      const header = all[2] || [];\n      const idx = (name) => header.findIndex(h => h && h.trim() === name);\n      this.C = {\n        mitra: 1, mitraIkr: 0, hpPo: 7, hpActual: 70,\n        reg: idx('Regional'), daop: idx('DAOP'), stasiun: idx('STASIUN'), sta: idx('Kode STA'),\n        kota: idx('Kota / Kabupaten'), stat: idx('Status Pembangunan'), rfs: idx('RFS Status'),\n        issue: idx('CATEGORY ISSUE'),\n        detailIssue: idx('DETAIL ISSUE') >= 0 ? idx('DETAIL ISSUE') : 59,\n        remark: idx('Remark Detail Issue') >= 0 ? idx('Remark Detail Issue') : 60,\n        bast: 244,\n        pic: 12, telp: 13, poitem: 6, nopo: 11, tglrilis: 10,\n        otb: 67, odc: 68, odp: 69, hc: 55,\n        hcAktif: 56,\n        mitraHist: idx('Mitra History') >= 0 ? idx('Mitra History') : 0,\n        rollout: idx('Actual Start ROLLOUT') >= 0 ? idx('Actual Start ROLLOUT') : 35,\n        rolloutEnd: idx('Actual End ROLLOUT') >= 0 ? idx('Actual End ROLLOUT') : 36,\n        statusMain: 17, statusMos: 26, mosDate: idx('MOS Date') >= 0 ? idx('MOS Date') : 23, atpActual: 44, planAtp: 43, statusRedline: 42,\n        reqMaterialDate: idx('Req Material') >= 0 ? idx('Req Material') : 21, noPengajuan: idx('No Pengajuan') >= 0 ? idx('No Pengajuan') : 112,\n        payDP: 236, dpStatus: 241, dpTgl: idx('Tgl Payment') >= 0 ? idx('Tgl Payment') : 240,\n        sla: idx('Aging SLA') >= 0 ? idx('Aging SLA') : 24, donasi: 32,\n        mainCat: idx('Main Cattegory') >= 0 ? idx('Main Cattegory') : (idx('Main Category') >= 0 ? idx('Main Category') : 82)\n      };\n      const data = all.slice(3).filter(row => row.length > 3 && ((row[1]||'').trim() || (row[this.C.stasiun]||'').trim()));\n      const names = [...new Set(data.map(row => (row[this.C.mitra]||'').trim()).filter(Boolean))];\n      const target = this.normName(this.FIXED_MITRA);\n      const hit = names.find(n => this.normName(n) === target) || names.find(n => this.normName(n).includes(target)) || names.find(n => target.includes(this.normName(n)));\n      this.setState({ loading: false, refreshing: false, rows: data, sel: hit || null, mitraNotFound: !hit,\n        lastUpdated: new Date().toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) });\n    } catch (e) {\n      if (attempt < MAX_RETRY) { await new Promise(res => setTimeout(res, 1800)); return this.load(attempt + 1, soft); }\n      this.setState(soft ? { refreshing: false } : { loading: false, error: 'Gagal memuat data: ' + e.message });\n    }\n  }\n\n  copyTextReport(key, text) {\n    this.setState({ mitraReportCopied: 'pending:' + key });\n    const finish = (state) => {\n      this.setState({ mitraReportCopied: state });\n      if (state) setTimeout(() => this.setState(s => s.mitraReportCopied === state ? { mitraReportCopied: null } : null), 2800);\n    };\n    const legacyCopy = () => {\n      try {\n        const ta = document.createElement('textarea');\n        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';\n        document.body.appendChild(ta); ta.select();\n        document.execCommand('copy');\n ;\n    if (!rem.trim()) return { noise: true };\n    // \"MIGRASI_<mitraName>\" with nothing after it is a subtotal line, not a real station.\n    if (migrasiPrefixed && this.normName(rem) === this.normName(mitraName)) return { noise: true };\n    const segs = rem.split('_').filter(Boolean);\n    const last = segs[segs.length - 1] || '';\n    // Split kabupaten/label whenever there's more than one segment, even if the last\n    // segment lacks an ST-/POP- prefix (some HC rows omit it) — otherwise the kabupaten\n    // gets glued into the label and breaks matching against FTTH station names.\n    if (segs.length > 1) return { noise: false, migrasiPrefixed, kabupaten: segs.slice(0, -1).join(' ') || '—', label: last };\n    return { noise: false, migrasiPrefixed, kabupaten: '—', label: rem.replace(/_/g, ' ') };\n  }\n\n  // Status MOS (Material On Site) — diambil dari PO dengan tanggal rilis paling baru.\n  mosBadgeMeta(raw, poDate) {\n    const v = (raw || '').toString().trim();\n    const k = v.toLowerCase();\n    let state = 'belum'; // belum | lengkap | parsial\n    if (k === 'lengkap') state = 'lengkap';\n    else if (v) state = 'parsial';\n    const color = state === 'lengkap' ? '#16a34a' : state === 'parsial' ? '#f59e0b' : '#94a3b8';\n    const icon = state === 'lengkap' ? 'check' : state === 'parsial' ? 'dstrip' : 'strip';\n    const label = v || 'Belum MOS';\n    return { mosHasBadge: true, mosBadgeColor: color, mosState: state,\n      mosIconCheck: icon === 'check', mosIconStrip: icon === 'strip', mosIconDstrip: icon === 'dstrip',\n      mosBadgeTitle: 'Status MOS (Material On Site): ' + label + (poDate ? ' — rilis PO terbaru ' + poDate.toString().trim() : ' — belum ada PO') };\n  }\n\n  normName(s) { return (s || '').toUpperCase().replace(/^RT[/-]RW_?/, '').replace(/[^A-Z0-9]+/g, ' ').trim(); }\n  // Known station-name spelling variants that refer to the same physical station across\n  // the FTTH tracker and the HC/CRM sheet (e.g. typos, alternate translit asiunList.filter(s => {\n      if (mStaMos && s.mosState !== mStaMos) return false;\n      if (mStaQ && !(s.stasiun.toLowerCase().includes(mStaQ) || s.sta.toLowerCase().includes(mStaQ))) return false;\n      if (mStaCat && s.staCategory !== mStaCat) return false;\n      return true;\n    });\n    hc = hcM.total; hcAktif = hcM.aktif;\n    const hcBadgeM = this.hcConfidenceBadge(hcMatch ? hcMatch.confidence : 'none');\n    const hcSummary = hcMatch && hcM.anyMatched ? {\n      matched: true, badge: hcBadgeM,\n      aktifFmt: fmt(hcM.aktif), isolirFmt: fmt(hcM.isolir), dismantleFmt: fmt(hcM.dismantle),\n      nonAktifFmt: fmt(hcM.nonAktif), totalFmt: fmt(hcM.total),\n      aktifPctStr: hcM.total ? Math.round(hcM.aktif/hcM.total*100) + '%' : '0%',\n      isolirPctStr: hcM.total ? Math.round(hcM.isolir/hcM.total*100) + '%' : '0%',\n      dismantlePctStr: hcM.total ? Math.round(hcM.dismantle/hcM.total*100) + '%' : '0%',\n      nonAktifPctStr: hcM.total ? Math.round(hcM.nonAktif/hcM.total*100) + '%' : '0%',\n      hasNoise: hcMatch.entry.noiseTotal > 0, noiseTotalFmt: fmt(hcMatch.entry.noiseTotal), noiseRows: hcMatch.entry.noiseRows,\n      hcName: hcMatch.hcName\n    } : { matched: false, badge: hcBadgeM };\n    const realPct = hpPo ? Math.round(hpActual/hpPo*100) : 0;\n    const hcPct = hpActual ? Math.round(hc/hpActual*100) : 0;\n    const hpAtpPct = hpPo ? Math.min(100, Math.round(hpActualAtp/hpPo*100)) : 0;\n    const reportKey = 'warep:' + name;\n    const reportCopied = this.state.mitraReportCopied === reportKey;\n    let atpDoneCount = 0, notAtpCount = 0;\n    rowsM.forEach(r => { if (this.isAtpDone(r)) atpDoneCount++; else notAtpCount++; });\n    const reportText = this.buildMitraReportText(name, {\n      hcPct, hcFmt: fmt(hc), hcAktifFmt: fmt(hcAktif),\n      hcAktifPct: hc ? Math.round(hcAktif/hc*100) : 0,\n      hcNonAktifPct: hc ? Math.round((hc-hcAktif)/hc*100) : 0, hcNonAktifFmt: fmt(Math.max(0, hc-hcAktif)),\n      realPct, hpActualFmt: fmt(hpActual), hpPoF       onMStaCatSelect: (e) => this.setState({ mStaCatFilter: e.target.value }),\n      mStaCatOptions: [\n        { key: '', label: 'Semua', color: '#334155', bg: '#e2e8f0', border: '#cbd5e1' },\n        { key: 'need_expand', label: 'Need Expand', color: '#15803d', bg: '#dcfce7', border: '#86efac' },\n        { key: 'pengawasan', label: 'Peningkatan', color: '#d97706', bg: '#fffbeb', border: '#fde68a' },\n        { key: 'berisiko', label: 'Pengawasan', color: '#dc2626', bg: '#fef2f2', border: '#fecaca' }\n      ].map(o => {\n        const active = mStaCat === o.key;\n        const count = o.key ? stasiunList.filter(s => s.staCategory === o.key).length : stasiunList.length;\n        return { label: o.label + ' (' + count + ')', active, setFilter: () => this.setState({ mStaCatFilter: o.key }),\n          chipColor: active ? '#fff' : o.color, chipBg: active ? o.color : '#f8fafc', chipBorder: o.border };\n      }),\n      mStaMosFilter: mStaMos,\n      onMStaMosSelect: (e) => this.setState({ mStaMosFilter: e.target.value }),\n      mStaMosOptions: [\n        { key: '', label: 'Semua MOS', color: '#334155', bg: '#e2e8f0', border: '#cbd5e1' },\n        { key: 'lengkap', label: 'Lengkap', color: '#16a34a', bg: '#dcfce7', border: '#86efac' },\n        { key: 'parsial', label: 'Belum Lengkap', color: '#b45309', bg: '#fef3c7', border: '#fde68a' },\n        { key: 'belum', label: 'Belum MOS', color: '#475569', bg: '#f1f5f9', border: '#cbd5e1' }\n      ].map(o => {\n        const active = mStaMos === o.key;\n        const count = o.key ? stasiunList.filter(s => s.mosState === o.key).length : stasiunList.length;\n        return { label: o.label + ' (' + count + ')', active, setFilter: () => this.setState({ mStaMosFilter: o.key }),\n          chipColor: active ? '#fff' : o.color, chipBg: active ? o.color : '#f8fafc', chipBorder: o.border };\n      }),\n      picName: picName || '—', picPhoneFmt: picPhone || '—',\n      waHref: picPhone ? 'https://wa.me/' + picPhone.replace(/[^0-9]/g,'').replace(/^0/,'62') : '',\n      waShareHref: (picPhone ? 'https://wa.me/' + picPhone.replace(/[^0-9]/g,'').replace(/^0/,'62') : 'https://wa.me/') + '?text=' + encodeURIComponent(reportText),\n      info: [\n        { multi: false, label: 'PIC Mitra', value: picName || '—' }\n      ]\n    };\n  }\n\n  buildMitraReportText(name, d) {\n    const now = new Date();\n    const pad = (n) => String(n).padStart(2, '0');\n    const tgl = pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear();\n    const hs = d.hcSummary && d.hcSummary.matched ? d.hcSummary : null;\n    const lines = [];\n    lines.push('📋 *REPORT PROGRESS MITRA*');\n    lines.push('👤 *' + name + '*');\n    lines.push('🗓 ' + tgl);\n    lines.push('');\n    lines.push('📊 *RINGKASAN*');\n    lines.push('*1. HC/HP Actual: ' + d.hcPct + '%*');\n    if (hs) {\n      lines.push('  – Aktif ' + hs.aktifFmt + ' (' + hs.aktifPctStr + ')');\n      lines.push('  – Isolir ' + hs.isolirFmt + ' (' + hs.isolirPctStr + ')');\n      lines.push('  – Dismantle ' + hs.dismantleFmt + ' (' + hs.dismantlePctStr + ')');\n      lines.push('  – Non Aktif ' + hs.nonAktifFmt + ' (' + hs.nonAktifPctStr + ')');\n      lines.push('  – Total HC: ' + hs.totalFmt);\n    } else {\n      lines.push('  – Aktif ' + d.hcAktifFmt + ' (' + d.hcAktifPct + '%)');\n      lines.push('  – Tidak Aktif ' + d.hcNonAktifFmt + ' (' + d.hcNonAktifPct + '%)');\n      lines.push('  – Total HC: ' + d.hcFmt);\n    }\n    lines.push('*2. HP Actual/PO: ' + d.realPct + '%*');\n    lines.push('  – Actual ' + d.hpActualFmt + ' / PO ' + d.hpPoFmt);\n    lines.push('• Total PO: ' + (d.atpDoneCount + d.notAtpCount));\n    lines.push('• PO Belum ATP: ' + d.notAtpCount);\n    lines.push('• Jumlah Stasiun: ' + d.stasiunList.length);\n    lines.push('');\n    lines.push('📍 *DETAIL PER STASIUN*');\n    d.stasiunList.forEach((s, i) => {\n      lines.push('');\n      lines.push((i+1) + '. *' + s.stasiun + (s.sta && s.sta !== '—' ? ' (' + s.sta + ')' : '') + '*');\n      lines.push('HC ' + s.pctHc + '% (' + s.hcFmt + ') · HP ' + s.pctReal + '% (' + s.hpActualFmt + ')');\n      lines.push('Total PO ' + s.sites + ' · Belum ATP ' + s.notAtpCount);\n      lines.push('KPI Stasiun: ' + s.staBadgeLabel);\n    });\n    lines.push('');\n    lines.push('_Pesan otomatis by Vendor Management_');\n    return lines.join('\\n');\n  }\n\n  computeMitraScores() {\n    const C = this.C, D = this.state.rows, num = this.num.bind(this), fmt = this.fmt.bind(this);\n    const M = {};\n    const regionHcTotal = {};\n    const seenRegionPair = new Set();\n    D.forEach(r => {\n      const name = (r[C.mitra]||'').trim(); if (!name) return;\n      if (!M[name]) M[name] = { name, hpPo: 0, hpActual: 0, hc: 0, hcAktif: 0, sites: 0, received: 0, slaSum: 0, slaCount: 0, _seenSta: new Set(), regionCount: {} };\n      const m = M[name];\n      m.hpPo += num(r[C.hpPo]); m.hpActual += num(r[C.hpActual]);\n      m.sites++;\n      const rg = (r[C.reg]||'').trim() || '(lainnya)';\n      m.regionCount[rg] = (m.regionCount[rg]||0) + 1;\n      const stnM = (r[C.stasiun]||'').trim();\n      if (stnM && !m._seenSta.has(stnM)) {\n        m._seenSta.add(stnM);\n        const hcv = this.hcFor(name, stnM);\n        m.hc += hcv.total; m.hcAktif += hcv.aktif;\n        const rpKey = rg + '||' + name + '||' + stnM;\n        if (!seenRegionPair.has(rpKey)) { seenRegionPair.add(rpKey); regionHcTotal[rg] = (regionHcTotal[rg]||0) + hcv.total; }\n      }\n      const mainStatus = (r[C.statusMain]||'').trim().toLowerCase();\n      const atpDate = (r[C.atpActual]||'').trim();\n      if (mainStatus === 'atp' || atpDate) m.received++;\n      const slaR = this.slaSiteScore(r);\n      m.slaSum += slaR.score; m.slaCount++;\n    });\n    const list = Object.values(M).filter(m => m.sites > 0);\n    const maxHp = Math.max(1, ...list.map(m => m.hpActual));\n    const maxHc = Math.max(1, ...list.map(m => m.hc));\n    list.forEach(m => {\n      m.region = Object.entries(m.regionCount).sort((a,b) => b[1]-a[1])[0][0];\n      const regionHc = regionHcTotal[m.region] || 0;\n      m.hcAktifRate = m.hc ? m.hcAktif / m.hc : 0;\n      m.hcTotalRate = m.hpActual ? Math.min(1, m.hc / m.hpActual) : 0;\n      m.realisasi = m.hpPo ? Math.min(1, m.hpActual / m.hpPo) : 0;\n      if (m.hpPo <= 1024) m.realisasi /= 3;\n      m.lotRate = m.sites ? m.received / m.sites : 0;\n      const volHp = m.hpActual / maxHp;\n      const volHc = m.hc / maxHc;\n      let volHpNorm = volHp, volHcNorm = volHc;\n      if (m.hpPo <= 512) { volHpNorm *= 0.3; volHcNorm *= 0.3; }\n      m.volHpNorm = volHpNorm; m.volHcNorm = volHcNorm;\n      m.volNorm = (volHpNorm + volHcNorm) / 2;\n      m.slaAvg = m.slaCount ? m.slaSum / m.slaCount : 0;\n      m.slaNorm = m.slaAvg;\n      m.score = Math.round(100 * (m.hcAktifRate*0.15 + m.hcTotalRate*0.20 + m.realisasi*0.20 + m.lotRate*0.05 + m.volHpNorm*0.15 + m.volHcNorm*0.15 + m.slaNorm*0.10));\n      m.category = m.score >= 55 ? 'unggulan' : (m.score >= 20 ? 'pengawasan' : 'berisiko');\n      m.fmtHp = fmt(m.hpActual);\n      m.fmtHc = fmt(m.hc);\n    });\n    return list.sort((a,b) => b.score - a.score);\n  }\n\n  renderVals() {\n    const st = this.state;\n    const ready = !st.loading && !!st.rows && !st.error;\n    const base = {\n      loading: st.loading, hasError: !!st.error, errorMsg: st.error,\n      lastUpdated: st.lastUpdated, hcUpdated: st.hcDataUpdated || (st.hcError ? 'gagal dimuat' : 'memuat…'),\n      reload: () => { this.load(); this.loadHc(); },\n      refreshLabel: st.refreshing ? 'Menyegarkan…' : 'Refresh',\n      refresh: () => this.load(0, true),\n      back: () => this.setState({ sel: null, mStaSearch: '', mStaCatFilter: '', mStaMosFilter: '' }),\n      q: st.q, hasQ: !!st.q,\n      setQ: (e) => this.setState({ q: e.target.value }),\n      clearQ: () => this.setState({ q: '' }),\n      setMitraDialogEl: this.setMitraDialogEl,\n      showSyncChips: false,\n      syncing: !!st.refreshing,\n      syncLabel: st.refreshing ? 'Menyinkronkan…' : 'Sync Data',\n      doSync: () => { this.load(0, true); this.loadHc(); this.loadSp(); },\n      syncItems: [\n        { label: 'Tracker FTTH', time: st.lastUpdated || '—', dot: st.error ? '#f87171' : '#4ade80' },\n        { label: 'HC / CRM', time: st.hcDataUpdated || (st.hcError ? 'gagal' : 'memuat…'), dot: st.hcError ? '#f87171' : (st.hcReady ? '#4ade80' : '#fbbf24') },\n        { label: 'Surat Peringatan', time: (st.spUpdated && st.spUpdated !== '—') ? st.spUpdated : (st.spError ? 'gagal' : (st.spReady ? 'tersinkron' : 'memuat…')), dot: st.spError ? '#f87171' : (st.spReady ? '#4ade80' : '#fbbf24') }\n      ],\n      mitraNotFound: !!st.mitraNotFound,\n      pdfDownloadingMitra: !!st.pdfDownloadingMitra,\n      pdfDownloadingMitraNot: !st.pdfDownloadingMitra,\n      pdfPctMitra: Math.round(st.pdfPctMitra || 0),\n      mitraBtnOpacity: st.pdfDownloadingMitra ? 0.7 : 1,\n      mitraCopyLabel: (() => {\n        const c = st.mitraReportCopied || '', k = 'warep:' + (st.sel || '');\n        if (c === 'pending:' + k) return 'Menyalin…';\n        if (c === k) return 'Report tersalin ✓';\n        if (c === 'textonly:' + k) return 'Teks report tersalin ✓';\n        if (c === 'failed:' + k) return 'Gagal menyalin';\n        return 'Salin Report ke WhatsApp';\n      })(),\n      mitraCopyShowToast: !!(st.mitraReportCopied && st.sel && st.mitraReportCopied.indexOf('warep:' + st.sel) >= 0),\n      downloadMitraImage: () => this.downloadCardPdf(this._mitraDialogEl, 'mitra-' + (st.sel || ''), 'mitra:' + (st.sel || '')),\n      downloadFullPageMitra: () => this.downloadFullPagePdf(this._mitraDialogEl, 'mitra-' + (st.sel || ''), 'pdfPctMitra', 'pdfDownloadingMitra'),\n      closeMitra: () => this.setState({ sel: null, mStaSearch: '', mStaCatFilter: '', mStaMosFilter: '' }),\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n      searchMode: ready && !st.sel, hasSel: ready && !!st.sel\n    };\n    if (!ready) return Object.assign(base, { results: [], resultLabel: '', noResults: false, m: {} });\n\n    const scores = this.computeMitraScores();\n    const q = (st.q || '').trim().toLowerCase();\n    const list = scores.filter(s => !q || s.name.toLowerCase().includes(q));\n    const results = list.slice(0, 60).map(s => {\n      const meta = this.categoryMeta(s.category);\n      return {\n        name: s.name, sub: s.region + ' · ' + s._seenSta.size + ' stasiun · HC ' + s.fmtHc,\n        hpFmt: s.fmtHp, badgeLabel: meta.label + ' · ' + s.score,\n        badgeColor: meta.color, badgeBg: meta.bg, badgeBorder: meta.border,\n        pick: () => { this.setState({ sel: s.name, mStaSearch: '', mStaCatFilter: '', mStaMosFilter: '' }); window.scrollTo({ top: 0 }); }\n      };\n    });\n    base.results = results;\n    base.noResults = results.length === 0;\n    base.resultLabel = q ? (list.length + ' mitra cocok') : (scores.length + ' mitra tersedia');\n\n    if (!st.sel) return Object.assign(base, { m: {} });\n    const m = this.buildMitra(st.sel);\n    m.barReal = Math.min(100, m.realPct);\n    m.noStasiun = m.stasiunList.length === 0;\n    if (!m.hcSummary.matched) {\n      Object.assign(m.hcSummary, { aktifFmt: '—', isolirFmt: '—', dismantleFmt: '—', nonAktifFmt: '—',\n        aktifPctStr: '—', isolirPctStr: '—', dismantlePctStr: '—', nonAktifPctStr: '—' });\n    }\n    return Object.assign(base, { m });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
